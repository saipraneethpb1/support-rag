# Render.com blueprint — free-tier deployment.
#
# Usage:
#   1. Push this repo to GitHub
#   2. In Render: New > Blueprint > connect the repo
#   3. Set env vars in Render dashboard (secret keys, not in this file)
#
# Notes on free tier:
#   - The web service sleeps after 15 min idle. First request after sleep
#     takes ~30s to wake.
#   - Qdrant and Redis aren't available on Render free. Options:
#       a) Use Qdrant Cloud 1GB free tier + Redis Cloud 30MB free tier
#       b) Fly.io free tier for Qdrant/Redis + Render for the web service
#       c) Single-dyno deployment where you bundle all three (heavier)
#   - Build time is fast (~2 min). No local model download — embeddings come from
#     Google Gemini Embedding API (EMBEDDING_BACKEND=api, dim=768).

services:
  - type: web
    name: ask-docs
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: QDRANT_URL
        sync: false    # set per-environment in dashboard
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: ask_docs
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: API_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ENV
        value: production
      - key: EMBEDDING_BACKEND
        value: api
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIM
        value: "768"
      - key: RERANKER_ENABLED
        value: "false"
      - key: POLLER_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: INFO
