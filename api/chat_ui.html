<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask</title>
<script>
  (function () {
    var t = localStorage.getItem('ask-theme');
    if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-sidebar: #f9f9f9;
    --bg-hover: #ececec;
    --bg-user: #f4f4f4;
    --ink: #0d0d0d;
    --muted: #8e8e8e;
    --line: rgba(0, 0, 0, 0.08);
    --composer: #ffffff;
    --composer-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
    --send: #0d0d0d;
    --send-ink: #ffffff;
    --danger: #c43131;
    --danger-bg: #fdecec;
    --chip: #ffffff;
    --overlay: rgba(255,255,255,.72);
    --radius: 28px;
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sidebar-w: 260px;
  }
  .dark {
    --bg: #212121;
    --bg-sidebar: #171717;
    --bg-hover: #2f2f2f;
    --bg-user: #303030;
    --ink: #ececec;
    --muted: #afafaf;
    --line: rgba(255, 255, 255, 0.1);
    --composer: #2f2f2f;
    --composer-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 8px 28px rgba(0,0,0,.35);
    --send: #ececec;
    --send-ink: #0d0d0d;
    --danger: #ff8a8a;
    --danger-bg: rgba(196, 49, 49, 0.22);
    --chip: #2f2f2f;
    --overlay: rgba(33,33,33,.78);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--font);
    background: var(--bg);
    overflow: hidden;
  }

  .app {
    height: 100%;
    display: flex;
  }

  aside {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 0.75rem;
    gap: 0.75rem;
  }
  .sb-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: -0.02em;
    padding: 0.4rem 0.45rem;
  }
  .logo-mark {
    width: 1.55rem;
    height: 1.55rem;
    border-radius: 8px;
    background: var(--ink);
    color: var(--bg);
    display: grid;
    place-items: center;
    font-size: 0.78rem;
    font-weight: 700;
  }
  .icon-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ink);
    width: 2.1rem;
    height: 2.1rem;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--bg-hover); }
  .icon-btn svg { width: 1.05rem; height: 1.05rem; }
  #sidebar-close { display: none; }

  .new-chat {
    appearance: none;
    width: 100%;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    border-radius: 12px;
    padding: 0.65rem 0.8rem;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font: inherit;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
  }
  .new-chat:hover { background: var(--bg-hover); }
  .new-chat svg { width: 1rem; height: 1rem; opacity: 0.8; }

  .chat-list-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0.15rem 0.55rem 0.1rem;
  }
  .chat-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    scrollbar-width: thin;
    scrollbar-color: rgba(142,142,142,.45) transparent;
  }
  .chat-empty {
    color: var(--muted);
    font-size: 0.8rem;
    padding: 0.45rem 0.55rem;
    line-height: 1.4;
  }
  .chat-item {
    display: flex;
    align-items: center;
    gap: 0.15rem;
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--ink);
    border-radius: 10px;
    padding: 0.42rem 0.35rem 0.42rem 0.65rem;
    font: inherit;
    font-size: 0.84rem;
    text-align: left;
    cursor: pointer;
  }
  .chat-item:hover, .chat-item.active { background: var(--bg-hover); }
  .chat-item .title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chat-item .del {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    flex-shrink: 0;
  }
  .chat-item:hover .del, .chat-item:focus-within .del, .chat-item .del:focus {
    opacity: 1;
  }
  .chat-item .del:hover { color: var(--danger); background: var(--danger-bg); }
  .chat-item .del svg { width: 0.85rem; height: 0.85rem; }

  .sb-foot {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.15rem 0.2rem;
    color: var(--muted);
    font-size: 0.75rem;
  }

  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
  }
  .topbar {
    flex-shrink: 0;
    height: 3.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 0.75rem;
    position: relative;
  }
  .topbar h1 {
    margin: 0;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    max-width: 60%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .menu-btn {
    display: none;
    position: absolute;
    left: 0.5rem;
    top: 50%;
    transform: translateY(-50%);
  }
  .icon-sun { display: none; }
  .dark .icon-sun { display: block; }
  .dark .icon-moon { display: none; }

  .stage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .stage:not(.has-thread) {
    justify-content: center;
  }

  #log {
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(142,142,142,.45) transparent;
  }
  .stage.has-thread #log {
    flex: 1;
    padding: 0.5rem 0 1.25rem;
  }
  .stage:not(.has-thread) #log {
    flex: 0 0 auto;
    overflow: visible;
  }

  .col {
    width: min(768px, calc(100% - 2.5rem));
    margin: 0 auto;
  }

  .empty {
    text-align: center;
    padding: 1rem 0 1.75rem;
  }
  .empty.hidden { display: none; }
  .empty h2 {
    margin: 0 0 1.35rem;
    font-size: clamp(1.7rem, 3vw, 2.05rem);
    font-weight: 600;
    letter-spacing: -0.04em;
  }
  .chips {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
    text-align: left;
  }
  .chip {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--ink);
    border-radius: 16px;
    padding: 0.85rem 0.95rem;
    font: inherit;
    font-size: 0.88rem;
    line-height: 1.35;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover { background: var(--bg-hover); }
  .chip span {
    display: block;
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 0.2rem;
  }

  #msgs {
    display: flex;
    flex-direction: column;
    gap: 1.65rem;
    padding-bottom: 0.5rem;
  }

  .row {
    display: flex;
    gap: 1rem;
    align-items: flex-start;
  }
  .row.user { justify-content: flex-end; }
  .appear { animation: rise 0.28s ease both; }

  .avatar {
    width: 1.75rem;
    height: 1.75rem;
    border-radius: 999px;
    background: var(--ink);
    color: var(--bg);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    margin-top: 0.15rem;
    font-size: 0.7rem;
    font-weight: 700;
  }

  .bot-msg {
    min-width: 0;
    flex: 1;
    font-size: 0.98rem;
    line-height: 1.7;
    padding-top: 0.05rem;
  }
  .user-msg {
    max-width: 70%;
    background: var(--bg-user);
    padding: 0.7rem 1rem;
    border-radius: 22px;
    font-size: 0.95rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .typing {
    display: inline-flex;
    gap: 0.28rem;
    align-items: center;
    padding: 0.55rem 0;
    color: var(--muted);
  }
  .typing i {
    width: 0.38rem;
    height: 0.38rem;
    border-radius: 999px;
    background: currentColor;
    display: block;
    animation: pulse 1.15s ease-in-out infinite;
  }
  .typing i:nth-child(2) { animation-delay: 0.14s; }
  .typing i:nth-child(3) { animation-delay: 0.28s; }

  .prose.streaming::after {
    content: "";
    display: inline-block;
    width: 0.45rem;
    height: 1.05em;
    margin-left: 0.12rem;
    vertical-align: -0.15em;
    background: currentColor;
    border-radius: 1px;
    animation: blink 1s step-end infinite;
  }
  .prose p { margin: 0 0 0.7em; }
  .prose p:last-child { margin: 0; }
  .prose ol, .prose ul { margin: 0 0 0.7em; padding-left: 1.25em; }
  .prose li { margin: 0.2em 0; }
  .prose strong { font-weight: 600; }
  .prose h1, .prose h2, .prose h3 { font-size: 1.05em; margin: 1em 0 0.4em; }
  .prose pre {
    margin: 0.7em 0;
    padding: 0.9rem 1rem;
    background: var(--bg-sidebar);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 0.84em;
  }
  .prose code {
    font-family: var(--mono);
    font-size: 0.86em;
    background: var(--bg-user);
    padding: 0.12em 0.35em;
    border-radius: 5px;
  }
  .prose pre code { background: transparent; padding: 0; }
  .prose a { color: inherit; }

  .cite-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    margin-top: 0.95rem;
  }
  .cite-link {
    color: var(--ink);
    text-decoration: none;
    font-size: 0.75rem;
    font-weight: 500;
    background: var(--bg-user);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.28rem 0.65rem;
  }
  .cite-link:hover { background: var(--bg-hover); }
  .cite-link b { font-weight: 600; margin-right: 0.28rem; color: var(--muted); }

  .error-msg, .sys-msg {
    width: min(768px, calc(100% - 2.5rem));
    margin: 0 auto;
    font-size: 0.85rem;
    text-align: center;
  }
  .sys-msg { color: var(--muted); }
  .sys-msg.error, .error-msg {
    color: var(--danger);
  }
  .error-msg {
    background: var(--danger-bg);
    border-radius: 12px;
    padding: 0.7rem 0.9rem;
    text-align: left;
  }

  .composer-wrap {
    flex-shrink: 0;
    padding: 0 0 0.85rem;
  }
  .stage.has-thread .composer-wrap {
    background: linear-gradient(180deg, transparent, var(--bg) 28%);
  }
  form {
    display: flex;
    align-items: flex-end;
    gap: 0.35rem;
    padding: 0.7rem 0.7rem 0.7rem 0.55rem;
    border-radius: var(--radius);
    background: var(--composer);
    box-shadow: var(--composer-shadow);
  }
  textarea {
    flex: 1;
    border: 0;
    outline: none;
    resize: none;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 1rem;
    line-height: 1.5;
    max-height: 200px;
    padding: 0.45rem 0.35rem;
  }
  textarea::placeholder { color: var(--muted); }
  .attach, .send {
    appearance: none;
    border: 0;
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .attach {
    background: transparent;
    color: var(--ink);
  }
  .attach:hover { background: var(--bg-hover); }
  .attach svg, .send svg { width: 1.1rem; height: 1.1rem; }
  .send {
    background: var(--send);
    color: var(--send-ink);
  }
  .send:disabled {
    opacity: 0.28;
    cursor: default;
  }
  .hint {
    margin: 0.55rem 0 0;
    text-align: center;
    color: var(--muted);
    font-size: 0.72rem;
  }

  .veil {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 40;
    background: var(--overlay);
    backdrop-filter: blur(6px);
    place-items: center;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    pointer-events: none;
  }
  body.dragging .veil { display: grid; }
  .scrim {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 20;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; }
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  @media (max-width: 820px) {
    aside {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      transform: translateX(-105%);
      transition: transform 0.22s ease;
      height: 100%;
    }
    aside.open { transform: none; }
    .menu-btn { display: inline-flex; }
    #sidebar-close { display: inline-flex; }
    body.nav-open .scrim { display: block; }
    .chips { grid-template-columns: 1fr; }
    .user-msg { max-width: 88%; }
    .col, .error-msg, .sys-msg { width: min(768px, calc(100% - 1.5rem)); }
  }
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar">
    <div class="sb-top">
      <div class="logo"><span class="logo-mark">A</span> Ask</div>
      <button class="icon-btn" id="sidebar-close" type="button" aria-label="Close sidebar" title="Close sidebar">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
    <button class="new-chat" id="new-chat" type="button">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 5v14M5 12h14"/>
      </svg>
      New chat
    </button>
    <div class="chat-list-label">Chats</div>
    <div class="chat-list" id="chat-list" aria-label="Your chats"></div>
    <div class="sb-foot">
      <span>Your files</span>
      <button class="icon-btn" id="theme-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
        <svg class="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        <svg class="icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
        </svg>
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open sidebar">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
      <h1 id="chat-title">New chat</h1>
    </div>

    <div class="stage" id="stage">
      <div id="log">
        <div class="col">
          <div class="empty" id="empty">
            <h2>What can I help with?</h2>
            <div class="chips">
              <button class="chip" type="button" data-q="How do I add my own files?">How do I add my own files?<span>Upload or drop docs, then ingest</span></button>
              <button class="chip" type="button" data-q="Can I upload files from the chat page?">Can I upload files from the chat page?<span>Use + in the composer or drop them</span></button>
              <button class="chip" type="button" data-q="How do citations work?">How do citations work?<span>Answers point at ingested passages</span></button>
              <button class="chip" type="button" data-q="How do I run this locally?">How do I run this locally?<span>Keys, Qdrant, and ingest</span></button>
            </div>
          </div>
          <div id="msgs"></div>
        </div>
      </div>

      <div class="composer-wrap">
        <form id="f" class="col" autocomplete="off">
          <input id="file-in" type="file" multiple accept=".md,.txt,.html,.htm,text/markdown,text/plain,text/html" hidden>
          <button class="attach" id="upload-btn" type="button" title="Upload documents" aria-label="Upload documents">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 5v14M5 12h14"/>
            </svg>
          </button>
          <textarea id="q" rows="1" autofocus placeholder="Ask anything about your files"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send" disabled>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 19V5m0 0l-6 6m6-6l6 6"/>
            </svg>
          </button>
        </form>
        <p class="hint">Answers cite the files you ingested. Drop .md, .txt, or .html anywhere to upload.</p>
      </div>
    </div>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<div class="veil" id="veil">Drop files to add them</div>

<script>
const logEl = document.getElementById('log');
const msgs  = document.getElementById('msgs');
const form  = document.getElementById('f');
const qEl   = document.getElementById('q');
const send  = document.getElementById('send');
const stage = document.getElementById('stage');
const empty = document.getElementById('empty');
const sidebar = document.getElementById('sidebar');
const titleEl = document.getElementById('chat-title');
const fileIn = document.getElementById('file-in');
const chatListEl = document.getElementById('chat-list');

const CHATS_KEY = 'ask-chats-v1';
const MAX_CHATS = 40;

let store = { chats: [], activeId: null };
let history = [];
let busy = false;

function uid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function loadStore() {
  try {
    const raw = JSON.parse(localStorage.getItem(CHATS_KEY) || 'null');
    if (raw && Array.isArray(raw.chats)) store = raw;
  } catch (_) {}
}
function saveStore() {
  try {
    if (store.chats.length > MAX_CHATS) {
      store.chats = store.chats
        .slice()
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
        .slice(0, MAX_CHATS);
    }
    localStorage.setItem(CHATS_KEY, JSON.stringify(store));
  } catch (_) {}
}
function activeChat() {
  return store.chats.find(c => c.id === store.activeId) || null;
}
function apiHistory(messages) {
  const pairs = [];
  (messages || []).forEach(m => {
    if (m.role === 'user' || m.role === 'assistant') pairs.push([m.role, m.text]);
  });
  return pairs.slice(-20);
}
function clipTitle(text) {
  const t = String(text || '').replace(/\s+/g, ' ').trim();
  if (!t) return 'New chat';
  return t.length > 42 ? t.slice(0, 42) + '…' : t;
}
function ensureActiveChat(title) {
  let chat = activeChat();
  if (chat) {
    if (title && (chat.title === 'New chat' || !chat.title)) chat.title = clipTitle(title);
    chat.updatedAt = Date.now();
    return chat;
  }
  chat = { id: uid(), title: clipTitle(title), updatedAt: Date.now(), messages: [] };
  store.chats.unshift(chat);
  store.activeId = chat.id;
  return chat;
}
function persistMessage(msg) {
  const chat = ensureActiveChat(msg.role === 'user' ? msg.text : undefined);
  chat.messages.push(msg);
  chat.updatedAt = Date.now();
  saveStore();
  renderChatList();
}
function renderChatList() {
  const chats = store.chats
    .filter(c => c.messages && c.messages.length)
    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  chatListEl.innerHTML = '';
  if (!chats.length) {
    const p = document.createElement('div');
    p.className = 'chat-empty';
    p.textContent = 'Your chats will show up here.';
    chatListEl.appendChild(p);
    return;
  }
  chats.forEach(c => {
    const row = document.createElement('div');
    row.className = 'chat-item' + (c.id === store.activeId ? ' active' : '');
    row.setAttribute('role', 'button');
    row.tabIndex = 0;
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = c.title || 'New chat';
    const del = document.createElement('button');
    del.className = 'del';
    del.type = 'button';
    del.title = 'Delete chat';
    del.setAttribute('aria-label', 'Delete chat');
    del.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M6 6l12 12M18 6L6 18"/></svg>';
    row.appendChild(title);
    row.appendChild(del);
    row.addEventListener('click', () => openChat(c.id));
    row.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openChat(c.id); }
    });
    del.addEventListener('click', e => {
      e.stopPropagation();
      deleteChat(c.id);
    });
    chatListEl.appendChild(row);
  });
}
function showEmptyThread() {
  msgs.innerHTML = '';
  empty.classList.remove('hidden');
  stage.classList.remove('has-thread');
  titleEl.textContent = 'New chat';
  history = [];
}
function replayMessages(messages) {
  msgs.innerHTML = '';
  (messages || []).forEach(m => {
    if (m.role === 'user') addUser(m.text, false);
    else if (m.role === 'assistant') addBotMessage(m.text, m.citations, false);
    else if (m.role === 'error') addError(m.text, false);
    else addSys(m.text, !!m.error, false);
  });
}
function openChat(id) {
  if (busy) return;
  const chat = store.chats.find(c => c.id === id);
  if (!chat) return;
  store.activeId = id;
  saveStore();
  history = apiHistory(chat.messages);
  if (!chat.messages.length) showEmptyThread();
  else {
    empty.classList.add('hidden');
    stage.classList.add('has-thread');
    titleEl.textContent = chat.title || 'New chat';
    replayMessages(chat.messages);
    scroll();
  }
  renderChatList();
  setNav(false);
  qEl.focus();
}
function startNewChat() {
  if (busy) return;
  const current = activeChat();
  if (current && !current.messages.length) {
    showEmptyThread();
    renderChatList();
    setNav(false);
    qEl.focus();
    return;
  }
  store.activeId = null;
  saveStore();
  showEmptyThread();
  renderChatList();
  setNav(false);
  qEl.value = '';
  qEl.style.height = 'auto';
  syncSend();
  qEl.focus();
}
function deleteChat(id) {
  store.chats = store.chats.filter(c => c.id !== id);
  if (store.activeId === id) {
    store.activeId = null;
    showEmptyThread();
  }
  saveStore();
  renderChatList();
}

function setNav(open) {
  sidebar.classList.toggle('open', open);
  document.body.classList.toggle('nav-open', open);
}
document.getElementById('menu-btn').addEventListener('click', () => setNav(true));
document.getElementById('sidebar-close').addEventListener('click', () => setNav(false));
document.getElementById('scrim').addEventListener('click', () => setNav(false));

document.getElementById('theme-btn').addEventListener('click', () => {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('ask-theme', isDark ? 'dark' : 'light');
});

function syncSend() {
  send.disabled = busy || !qEl.value.trim();
}
qEl.addEventListener('input', () => {
  qEl.style.height = 'auto';
  qEl.style.height = Math.min(qEl.scrollHeight, 200) + 'px';
  syncSend();
});
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

document.getElementById('upload-btn').addEventListener('click', () => fileIn.click());
fileIn.addEventListener('change', () => {
  if (fileIn.files && fileIn.files.length) {
    uploadFiles(fileIn.files);
    fileIn.value = '';
  }
});

document.addEventListener('dragover', e => {
  e.preventDefault();
  if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) {
    document.body.classList.add('dragging');
  }
});
document.addEventListener('dragleave', e => {
  if (!e.relatedTarget) document.body.classList.remove('dragging');
});
document.addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('dragging');
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
    uploadFiles(e.dataTransfer.files);
  }
});

document.querySelectorAll('.chip').forEach(btn => {
  btn.addEventListener('click', () => {
    qEl.value = btn.getAttribute('data-q') || '';
    qEl.dispatchEvent(new Event('input'));
    form.requestSubmit();
  });
});

document.getElementById('new-chat').addEventListener('click', startNewChat);

function enterThread(title) {
  empty.classList.add('hidden');
  stage.classList.add('has-thread');
  if (title && titleEl.textContent === 'New chat') {
    titleEl.textContent = title.length > 48 ? title.slice(0, 48) + '…' : title;
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function safeUrl(u) {
  try {
    const url = new URL(String(u || ''), window.location.origin);
    if (url.protocol === 'http:' || url.protocol === 'https:') return url.href;
  } catch (_) {}
  return '#';
}
function renderMarkdown(md) {
  const raw = marked.parse(String(md || ''), { async: false });
  return DOMPurify.sanitize(raw, { USE_PROFILES: { html: true } });
}
function scroll() { logEl.scrollTop = logEl.scrollHeight; }

function avatar() {
  const d = document.createElement('div');
  d.className = 'avatar';
  d.setAttribute('aria-hidden', 'true');
  d.textContent = 'A';
  return d;
}

function addUser(text, persist) {
  enterThread(text);
  const row = document.createElement('div');
  row.className = 'row user' + (persist === false ? '' : ' appear');
  const bubble = document.createElement('div');
  bubble.className = 'user-msg';
  bubble.textContent = text;
  row.appendChild(bubble);
  msgs.appendChild(row); scroll();
  if (persist !== false) persistMessage({ role: 'user', text });
}

function addTyping() {
  const row = document.createElement('div');
  row.id = 'typing';
  row.className = 'row appear';
  const tb = document.createElement('div');
  tb.className = 'typing';
  tb.innerHTML = '<i></i><i></i><i></i>';
  row.appendChild(avatar());
  row.appendChild(tb);
  msgs.appendChild(row); scroll();
}

function removeTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

function addBot() {
  const row = document.createElement('div');
  row.className = 'row appear';
  const bubble = document.createElement('div');
  bubble.className = 'bot-msg';
  const prose = document.createElement('div');
  prose.className = 'prose streaming';
  bubble.appendChild(prose);
  row.appendChild(avatar());
  row.appendChild(bubble);
  msgs.appendChild(row);
  return { prose, bubble };
}

function addBotMessage(text, citations, persist) {
  enterThread();
  const row = document.createElement('div');
  row.className = 'row' + (persist === false ? '' : ' appear');
  const bubble = document.createElement('div');
  bubble.className = 'bot-msg';
  const prose = document.createElement('div');
  prose.className = 'prose';
  prose.innerHTML = renderMarkdown(text);
  bubble.appendChild(prose);
  addCitations(citations, bubble);
  row.appendChild(avatar());
  row.appendChild(bubble);
  msgs.appendChild(row);
}

function addError(msg, persist) {
  removeTyping();
  enterThread();
  const bubble = document.createElement('div');
  bubble.className = 'error-msg' + (persist === false ? '' : ' appear');
  bubble.textContent = msg;
  msgs.appendChild(bubble); scroll();
  if (persist !== false) persistMessage({ role: 'error', text: msg });
}

function addSys(text, isError, persist) {
  enterThread();
  const row = document.createElement('div');
  row.className = 'sys-msg' + (persist === false ? '' : ' appear') + (isError ? ' error' : '');
  row.textContent = text;
  msgs.appendChild(row); scroll();
  if (persist !== false) persistMessage({ role: 'sys', text, error: !!isError });
}

async function uploadFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  addSys('Indexing ' + files.length + ' file' + (files.length === 1 ? '' : 's') + '…');
  const body = new FormData();
  files.forEach(f => body.append('files', f, f.name));
  try {
    const resp = await fetch('/ingest/upload', {
      method: 'POST',
      credentials: 'same-origin',
      body,
    });
    if (resp.status === 401) {
      addSys('Could not authenticate. Refresh the page and try again.', true);
      return;
    }
    if (!resp.ok) {
      addSys('Upload failed (' + resp.status + ').', true);
      return;
    }
    const data = await resp.json();
    const ok = (data.files || []).filter(f => f.ok).map(f => f.filename);
    const bad = (data.files || []).filter(f => !f.ok);
    if (ok.length) addSys('Ready: ' + ok.join(', ') + '. Ask a question about them.');
    bad.forEach(f => addSys((f.filename || 'file') + ': ' + (f.error || 'failed'), true));
  } catch (err) {
    addSys('Could not reach the server to upload.', true);
  }
}

function addCitations(citations, bubble) {
  if (!citations || !citations.length) return;
  const bar = document.createElement('div');
  bar.className = 'cite-bar';
  citations.forEach(c => {
    const a = document.createElement('a');
    a.href = safeUrl(c.url);
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.className = 'cite-link';
    a.innerHTML = '<b>[' + esc(c.marker) + ']</b>' + esc(c.title);
    bar.appendChild(a);
  });
  bubble.appendChild(bar);
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const question = qEl.value.trim();
  if (!question || busy) return;
  qEl.value = '';
  qEl.style.height = 'auto';
  busy = true;
  syncSend();

  addUser(question);
  addTyping();

  let tokens = [], prose, bubble, botCreated = false, lastCitations = [];

  try {
    const resp = await fetch('/chat/stream', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({question, history}),
    });
    if (!resp.ok) {
      addError(resp.status === 401 ? 'Could not authenticate. Refresh the page and try again.' : 'Request failed (' + resp.status + '). Try again.');
      return;
    }

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        let payload;
        try { payload = JSON.parse(line.slice(5).trim()); } catch { continue; }

        if (payload.type === 'token') {
          if (!botCreated) { removeTyping(); ({prose, bubble} = addBot()); botCreated = true; }
          tokens.push(payload.text);
          prose.innerHTML = renderMarkdown(tokens.join(''));
          scroll();
        } else if (payload.type === 'meta' && bubble) {
          if (prose) prose.classList.remove('streaming');
          lastCitations = payload.citations || [];
          addCitations(lastCitations, bubble);
          scroll();
        } else if (payload.type === 'error') {
          addError(payload.message || 'Unknown error');
        }
      }
    }
    if (prose) prose.classList.remove('streaming');
    if (tokens.length) {
      history.push(['user', question]);
      history.push(['assistant', tokens.join('')]);
      if (history.length > 20) history = history.slice(-20);
      persistMessage({ role: 'assistant', text: tokens.join(''), citations: lastCitations });
    }
  } catch (err) {
    addError('Connection error — is the server running?');
  } finally {
    busy = false;
    syncSend();
    qEl.focus();
  }
});

loadStore();
renderChatList();
if (store.activeId && store.chats.some(c => c.id === store.activeId && c.messages && c.messages.length)) {
  openChat(store.activeId);
} else {
  renderChatList();
}
</script>
